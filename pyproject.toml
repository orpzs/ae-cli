[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-cli"
version = "0.1.0"
description = "Real-time conversational streaming CLI for Vertex AI Agent Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.24.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
ae = "ae_cli.main:main"
ae-cli = "ae_cli.main:main"
